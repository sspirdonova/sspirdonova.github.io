<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Milky Voice Orb (stable speaking)</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#fff;}
    canvas{display:block;}
    #ui{
      position:fixed;left:14px;top:14px;z-index:10;
      display:flex;gap:10px;align-items:center;flex-wrap:wrap;
      font:13px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }
    select,button,.badge{
      padding:8px 10px;border-radius:12px;
      border:1px solid rgba(0,0,0,.12);
      background:rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
    }
    button{cursor:pointer;}
    button:active{transform:translateY(1px);}
    .badge{user-select:none;}
  </style>
</head>
<body>

<div id="ui">
  <select id="state">
    <option value="idle">Idle</option>
    <option value="listening">Listening</option>
    <option value="thinking">Thinking</option>
    <option value="speaking">Speaking</option>
  </select>
  <button id="mic">Enable mic (optional)</button>
  <span class="badge" id="badge">level: 0.00</span>
</div>

<script src="./three.min.js"></script>
<script>
if (!window.THREE) { document.body.innerHTML = "❌ three.min.js not found next to this HTML"; throw new Error("THREE missing"); }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 50);
camera.position.z = 4.7;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setClearColor(0xffffff, 1);
document.body.appendChild(renderer.domElement);

const geo = new THREE.SphereGeometry(1.0, 84, 84);

/* Keep your existing look (soft + not dark). Only speaking motion changes below. */
const PRESETS = {
  idle:      { motion:1.10, ribbon:1.18, warp:0.014, milk:0.68, speak:0.0 },
  listening: { motion:1.35, ribbon:1.22, warp:0.018, milk:0.66, speak:0.0 },
  thinking:  { motion:3.55, ribbon:1.20, warp:0.016, milk:0.67, speak:0.0 },
  speaking:  { motion:1.35, ribbon:1.28, warp:0.018, milk:0.65, speak:1.0 }
};

let state = "idle";
let target = { ...PRESETS.idle };

/* No flash: initial uniforms match idle preset */
const uniforms = {
  uTime: { value: 0 },
  uSpeakPhase: { value: 0 },     // ✅ stable small phase for speaking (prevents long-run jitter)

  // palette
  uPurple: { value: new THREE.Color("#b15cff") },
  uBlue:   { value: new THREE.Color("#3b6cff") },
  uPink:   { value: new THREE.Color("#ff7ac8") },
  uBeige:  { value: new THREE.Color("#f1e4d2") },

  // look
  uMilk:   { value: PRESETS.idle.milk },
  uSoft:   { value: 0.86 },
  uEdge:   { value: 0.72 },

  // motion
  uMotion: { value: PRESETS.idle.motion },
  uRibbonStrength: { value: PRESETS.idle.ribbon },
  uWarpAmp: { value: PRESETS.idle.warp },

  // voice & speaking blend
  uVoice: { value: 0.0 },
  uSpeak: { value: PRESETS.idle.speak }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uWarpAmp;
    varying vec3 vPos;

    float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
    float noise(vec3 p){
      vec3 i=floor(p), f=fract(p);
      f = f*f*(3.0-2.0*f);
      float n000=hash(i+vec3(0,0,0));
      float n100=hash(i+vec3(1,0,0));
      float n010=hash(i+vec3(0,1,0));
      float n110=hash(i+vec3(1,1,0));
      float n001=hash(i+vec3(0,0,1));
      float n101=hash(i+vec3(1,0,1));
      float n011=hash(i+vec3(0,1,1));
      float n111=hash(i+vec3(1,1,1));
      float n00=mix(n000,n100,f.x);
      float n10=mix(n010,n110,f.x);
      float n01=mix(n001,n101,f.x);
      float n11=mix(n011,n111,f.x);
      float n0=mix(n00,n10,f.y);
      float n1=mix(n01,n11,f.y);
      return mix(n0,n1,f.z);
    }
    float fbm(vec3 p){
      float v=0.0, a=0.5;
      for(int i=0;i<3;i++){ v += a*noise(p); p*=2.0; a*=0.5; }
      return v;
    }

    void main(){
      vec3 p = position;
      float t = uTime * 0.35;
      float n = fbm(p*1.2 + vec3(t, -t*0.6, t*0.25));
      p += normal * ((n - 0.5) * uWarpAmp);
      vPos = p;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;

    uniform float uTime;
    uniform float uSpeakPhase;
    uniform vec3 uPurple, uBlue, uPink, uBeige;
    uniform float uMilk, uSoft, uEdge;
    uniform float uMotion, uRibbonStrength;
    uniform float uVoice;
    uniform float uSpeak;

    varying vec3 vPos;

    float softPow(float x, float softness){
      float k = mix(2.0, 1.15, softness);
      return pow(clamp(x,0.0,1.0), k);
    }

    float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
    float noise(vec3 p){
      vec3 i=floor(p), f=fract(p);
      f = f*f*(3.0-2.0*f);
      float n000=hash(i+vec3(0,0,0));
      float n100=hash(i+vec3(1,0,0));
      float n010=hash(i+vec3(0,1,0));
      float n110=hash(i+vec3(1,1,0));
      float n001=hash(i+vec3(0,0,1));
      float n101=hash(i+vec3(1,0,1));
      float n011=hash(i+vec3(0,1,1));
      float n111=hash(i+vec3(1,1,1));
      float n00=mix(n000,n100,f.x);
      float n10=mix(n010,n110,f.x);
      float n01=mix(n001,n101,f.x);
      float n11=mix(n011,n111,f.x);
      float n0=mix(n00,n10,f.y);
      float n1=mix(n01,n11,f.y);
      return mix(n0,n1,f.z);
    }
    float fbm(vec3 p){
      float v=0.0, a=0.5;
      for(int i=0;i<4;i++){ v += a*noise(p); p*=2.0; a*=0.5; }
      return v;
    }

    void main(){
      vec3 p = normalize(vPos);

      // Base ribbon (idle/listen/think) — unchanged
      float t0 = uTime * (0.85 * uMotion);
      float axis_base =
        0.30*sin(p.x*1.6 + t0*1.05) +
        0.26*cos(p.y*1.3 - t0*0.95) +
        0.18*sin(p.z*1.1 + t0*0.75);

      float band_base = 1.0 - abs(p.y + axis_base);
      band_base = clamp(band_base * 1.18, 0.0, 1.0);
      band_base = softPow(band_base, uSoft);

      // Speaking band — ONLY change: stable phase + slower motion + more waves + bigger height
      float voice = clamp(uVoice, 0.0, 1.0);

      float freq = 5.2;                         // more waves
      float amp  = uSpeak * (0.02 + 0.34*voice); // bigger height, but controlled
      float phase = uSpeakPhase;                 // ✅ stays small forever (prevents jitter)

      float wave =
        sin(p.x*freq + phase) +
        0.45*sin(p.x*(freq*1.75) - phase*0.70) +
        0.22*sin(p.x*(freq*2.45) + phase*0.50);

      // no center envelope -> waves visible in the center immediately
      float center = -0.03 + amp * wave;

      float thickness = mix(0.34, 0.50, uSpeak) * 0.74;
      float band_speak = 1.0 - abs(p.y - center) / thickness;
      band_speak = clamp(band_speak, 0.0, 1.0);
      band_speak = softPow(band_speak, uSoft);

      float band = mix(band_base, band_speak, uSpeak);

      // Colors (kept soft & light — unchanged scheme)
      float f1 = fbm(p*1.15 + vec3(t0*0.35, -t0*0.22, t0*0.18));
      float f2 = fbm(p*0.85 + vec3(-t0*0.28, t0*0.20, -t0*0.12));

      float g = softPow(0.5 + 0.5*p.x + (f1-0.5)*0.18, uSoft);

      vec3 base = mix(uBeige, uBlue, g);

      float pinkMask = softPow(0.5 + 0.5*p.z + (f2-0.5)*0.14, uSoft);
      base = mix(base, uPink, pinkMask * 0.50 * (0.70 + 0.30*band));

      float warm = softPow(0.55 + 0.45*p.y + (f1-0.5)*0.12, uSoft);
      base = mix(base, uBeige, warm * 0.42);

      vec3 milky = mix(base, vec3(1.0), uMilk);

      float rs = clamp(uRibbonStrength, 0.0, 1.35);
      float ribbonBoost = mix(0.14, 0.78, rs);

      vec3 col = mix(milky, base, band * ribbonBoost);

      float edge = clamp(1.0 - length(vPos)*0.55, 0.0, 1.0);
      edge = pow(edge, mix(1.15, 2.3, uEdge));
      float alpha = 0.56 * edge + 0.22 * band + uSpeak * (voice * 0.10);

      gl_FragColor = vec4(clamp(col, 0.0, 1.0), clamp(alpha, 0.0, 0.92));
    }
  `
});

const orb = new THREE.Mesh(geo, mat);
orb.scale.setScalar(0.88);
scene.add(orb);

function setState(next){
  state = next;
  target = { ...PRESETS[next] };
}
document.getElementById("state").addEventListener("change", (e) => setState(e.target.value));

function approach(cur, tgt, lambda, dt){
  return cur + (tgt - cur) * (1 - Math.exp(-lambda * dt));
}

// Mic
const badge = document.getElementById("badge");
const micBtn = document.getElementById("mic");
let micEnabled = false;
let voiceLevel = 0;

micBtn.addEventListener("click", async () => {
  if (micEnabled) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    const src = ac.createMediaStreamSource(stream);
    const analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
    const data = new Uint8Array(analyser.fftSize);

    micEnabled = true;
    micBtn.textContent = "Mic enabled ✓";

    const tickMic = () => {
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i=0;i<data.length;i++){
        const x = (data[i]-128)/128;
        sum += x*x;
      }
      const rms = Math.sqrt(sum / data.length);
      voiceLevel = Math.min(1, rms * 4.8);
      requestAnimationFrame(tickMic);
    };
    tickMic();
  } catch(e){
    alert("Mic permission denied or not available.");
  }
});

// Animate
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t  = clock.elapsedTime;

  uniforms.uTime.value = t;

  // ✅ stable speaking phase (prevents long-run jitter + no speed-up)
  // slower by design, and still reacts gently to voice level
  const voice = uniforms.uVoice.value;
  const phaseSpeed = 0.55 + 0.35 * voice;  // slow & stable
  uniforms.uSpeakPhase.value += dt * phaseSpeed;
  if (uniforms.uSpeakPhase.value > 1000.0) uniforms.uSpeakPhase.value = 0.0;

  uniforms.uMotion.value = approach(uniforms.uMotion.value, target.motion, 6.0, dt);
  uniforms.uRibbonStrength.value = approach(uniforms.uRibbonStrength.value, target.ribbon, 7.0, dt);
  uniforms.uWarpAmp.value = approach(uniforms.uWarpAmp.value, target.warp, 6.0, dt);
  uniforms.uMilk.value = approach(uniforms.uMilk.value, target.milk, 6.0, dt);
  uniforms.uSpeak.value = approach(uniforms.uSpeak.value, target.speak, 10.0, dt);

  const vTarget = (state === "speaking") ? voiceLevel : 0;
  uniforms.uVoice.value = approach(uniforms.uVoice.value, vTarget, 10.0, dt);

  orb.rotation.y = t * 0.10;
  orb.rotation.x = Math.sin(t * 0.08) * 0.06;

  const breathe = 1.0 + Math.sin(t * 0.9) * 0.012 + uniforms.uVoice.value * 0.02;
  orb.scale.setScalar(0.88 * breathe);

  badge.textContent = `level: ${uniforms.uVoice.value.toFixed(2)} • ${state}`;

  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
